[project]
name = "doh-ids"
version = "0.1.0"
description = "Reprodução do IDS explicável para ataques DNS over HTTPS de Zebin, Rezvy e Luo (IEEE TIFS, 2022)"
requires-python = "==3.12.*"
dependencies = [
    "scikit-learn==1.9.1",
    "imbalanced-learn==0.14.2",
    "mlxtend==0.25.0",
    "xgboost==3.4.1",
    "shap==0.52.0",
    "pandas==3.0.6",
    "numpy==2.3.5",
    "pyarrow==25.0.1",
    "matplotlib==3.11.2",
    "scipy==1.18.1",
    "explainerdashboard==0.5.8",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doh_ids"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C90", "ERA", "PT", "D1"]
ignore = ["D104"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
